# TDD Example: Sequencer StatefulSet Tests
# These tests define the behavior we want BEFORE implementing the template

suite: test sequencer statefulset
templates:
  - sequencer/statefulset.yaml

tests:
  # Test 1: Basic rendering
  - it: should render a StatefulSet when sequencer is enabled
    set:
      sequencer.enabled: true
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: metadata.name
          value: RELEASE-NAME-cdk-erigon-sequencer

  # Test 2: Should not render when disabled
  - it: should not render when sequencer is disabled
    set:
      sequencer.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  # Test 3: Replicas configuration
  - it: should set replicas from values
    set:
      sequencer.replicas: 1
    asserts:
      - equal:
          path: spec.replicas
          value: 1

  # Test 4: Image configuration
  - it: should use image from values
    set:
      image.repository: test-repo
      image.tag: test-tag
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: test-repo:test-tag

  # Test 5: NATS port exposure
  - it: should expose NATS port when embedded NATS is enabled
    set:
      sequencer.nats.embedded: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: nats
            containerPort: 4222
            protocol: TCP

  # Test 6: Security context
  - it: should set pod security context
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 1000

  # Test 7: Resource limits
  - it: should set resource requests and limits
    set:
      sequencer.resources.requests.memory: 2Gi
      sequencer.resources.limits.cpu: 2000m
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 2Gi
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: 2000m
