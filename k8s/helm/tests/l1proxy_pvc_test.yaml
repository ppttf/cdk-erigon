suite: L1 Proxy PVC
templates:
  - l1-proxy/pvc.yaml
tests:
  - it: should not create PVC when l1Proxy.enabled is false
    set:
      l1Proxy.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should not create PVC when persistence is disabled
    set:
      l1Proxy.enabled: true
      l1Proxy.persistence.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should create PVC when both enabled and persistence are true
    set:
      l1Proxy.enabled: true
      l1Proxy.persistence.enabled: true
      l1Proxy.persistence.size: 5Gi
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PersistentVolumeClaim
      - equal:
          path: metadata.name
          value: RELEASE-NAME-cdk-erigon-l1-proxy-cache

  - it: should configure storage size
    set:
      l1Proxy.enabled: true
      l1Proxy.persistence.enabled: true
      l1Proxy.persistence.size: 10Gi
    asserts:
      - equal:
          path: spec.resources.requests.storage
          value: 10Gi

  - it: should use ReadWriteOnce access mode
    set:
      l1Proxy.enabled: true
      l1Proxy.persistence.enabled: true
    asserts:
      - contains:
          path: spec.accessModes
          content: ReadWriteOnce

  - it: should configure storage class when specified
    set:
      l1Proxy.enabled: true
      l1Proxy.persistence.enabled: true
      l1Proxy.persistence.storageClass: fast-ssd
    asserts:
      - equal:
          path: spec.storageClassName
          value: fast-ssd

  - it: should not configure storage class when not specified
    set:
      l1Proxy.enabled: true
      l1Proxy.persistence.enabled: true
      l1Proxy.persistence.storageClass: ""
    asserts:
      - isNull:
          path: spec.storageClassName
