suite: test Grafana Dashboards ConfigMap
templates:
  - monitoring/grafana-dashboards.yaml
tests:
  - it: should not create ConfigMap when monitoring disabled
    set:
      monitoring.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should not create when dashboards disabled
    set:
      monitoring.enabled: true
      monitoring.grafana.dashboards.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should create ConfigMap when dashboards enabled
    set:
      monitoring.enabled: true
      monitoring.grafana.dashboards.enabled: true
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: RELEASE-NAME-cdk-erigon-grafana-dashboards

  - it: should have grafana_dashboard label
    set:
      monitoring.enabled: true
      monitoring.grafana.dashboards.enabled: true
    asserts:
      - equal:
          path: metadata.labels.grafana_dashboard
          value: "1"

  - it: should contain both dashboard files
    set:
      monitoring.enabled: true
      monitoring.grafana.dashboards.enabled: true
    asserts:
      - isNotEmpty:
          path: data["nats-jetstream.json"]
      - isNotEmpty:
          path: data["cdk-erigon-performance.json"]
