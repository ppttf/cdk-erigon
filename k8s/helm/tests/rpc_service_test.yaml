suite: test rpc service
templates:
  - rpc/service.yaml

tests:
  - it: should render two Services when rpc is enabled
    set:
      rpc.enabled: true
    asserts:
      - hasDocuments:
          count: 2

  - it: should not render when rpc is disabled
    set:
      rpc.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should render main service with correct name
    set:
      rpc.enabled: true
    documentIndex: 0
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-cdk-erigon-rpc

  - it: should render headless service with correct name
    set:
      rpc.enabled: true
    documentIndex: 1
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-cdk-erigon-rpc-headless

  - it: should use correct selector labels
    set:
      rpc.enabled: true
    documentIndex: 0
    asserts:
      - equal:
          path: spec.selector["app.kubernetes.io/name"]
          value: cdk-erigon
      - equal:
          path: spec.selector["app.kubernetes.io/instance"]
          value: RELEASE-NAME
      - equal:
          path: spec.selector.component
          value: rpc

  - it: should expose HTTP port
    set:
      rpc.enabled: true
    documentIndex: 0
    asserts:
      - contains:
          path: spec.ports
          content:
            name: http
            port: 8545
            targetPort: http
            protocol: TCP

  - it: should expose WebSocket port
    set:
      rpc.enabled: true
    documentIndex: 0
    asserts:
      - contains:
          path: spec.ports
          content:
            name: ws
            port: 8546
            targetPort: ws
            protocol: TCP

  - it: should expose private API port
    set:
      rpc.enabled: true
    documentIndex: 0
    asserts:
      - contains:
          path: spec.ports
          content:
            name: private-api
            port: 9093
            targetPort: private-api
            protocol: TCP

  - it: should expose NATS port when nats is enabled
    set:
      rpc.enabled: true
      rpc.nats.enabled: true
      rpc.chainConfig.dataStreamNatsPort: 4223
    documentIndex: 0
    asserts:
      - contains:
          path: spec.ports
          content:
            name: nats
            port: 4223
            targetPort: nats
            protocol: TCP

  - it: should not expose NATS port when nats is disabled
    set:
      rpc.enabled: true
      rpc.nats.enabled: false
    documentIndex: 0
    asserts:
      - notContains:
          path: spec.ports
          content:
            name: nats
          any: true

  - it: should be ClusterIP service by default
    set:
      rpc.enabled: true
    documentIndex: 0
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP

  - it: should support LoadBalancer service type
    set:
      rpc.enabled: true
      rpc.service.type: LoadBalancer
    documentIndex: 0
    asserts:
      - equal:
          path: spec.type
          value: LoadBalancer

  - it: headless service should have clusterIP None
    set:
      rpc.enabled: true
    documentIndex: 1
    asserts:
      - equal:
          path: spec.clusterIP
          value: None
