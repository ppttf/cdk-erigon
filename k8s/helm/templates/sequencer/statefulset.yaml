{{- if .Values.sequencer.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "cdk-erigon.fullname" . }}-sequencer
  labels:
    {{- include "cdk-erigon.labels" . | nindent 4 }}
    component: sequencer
spec:
  replicas: {{ .Values.sequencer.replicas }}
  serviceName: {{ include "cdk-erigon.fullname" . }}-sequencer
  selector:
    matchLabels:
      {{- include "cdk-erigon.selectorLabels" . | nindent 6 }}
      component: sequencer
  template:
    metadata:
      labels:
        {{- include "cdk-erigon.selectorLabels" . | nindent 8 }}
        component: sequencer
    spec:
      securityContext:
        runAsNonRoot: {{ .Values.sequencer.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.sequencer.securityContext.runAsUser }}
        fsGroup: {{ .Values.sequencer.securityContext.fsGroup }}
      containers:
      - name: erigon
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- if .Values.sequencer.nats.embedded }}
        ports:
        - name: nats
          containerPort: 4222
          protocol: TCP
        {{- end }}
        resources:
          {{- toYaml .Values.sequencer.resources | nindent 10 }}
{{- end }}