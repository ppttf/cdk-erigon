{{- if .Values.rpc.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cdk-erigon.fullname" . }}-rpc-chain
  labels:
    {{- include "cdk-erigon.labels" . | nindent 4 }}
    component: rpc
data:
  erigon.yaml: |
    # RPC Node Configuration
    # Generated from Helm values
    
    datadir: {{ .Values.rpc.chainConfig.datadir }}
    chain: {{ .Values.rpc.chainConfig.chain }}
    
    # HTTP/RPC settings
    http: true
    http.addr: 0.0.0.0
    http.port: 8545
    http.vhosts: any
    http.corsdomain: any
    http.api: [eth, debug, net, trace, web3, erigon, zkevm]
    
    # WebSocket settings
    ws: true
    ws.port: 8546
    
    # Private API
    private.api.addr: 0.0.0.0:9093
    
    # External consensus layer
    externalcl: true
    
    # Disable txpool for RPC nodes
    txpool.disable: true
    
    # zkEVM L2 configuration
    zkevm.l2-chain-id: {{ .Values.rpc.chainConfig.chainId | int64 }}
    zkevm.l2-sequencer-rpc-url: {{ .Values.rpc.chainConfig.l2SequencerRpcUrl }}
    zkevm.l2-datastreamer-url: {{ .Values.rpc.chainConfig.l2DatastreamerUrl }}

    # NATS seed (sequencer connection)
    zkevm.l2-nats-seed-host: {{ .Values.rpc.chainConfig.natsSeedHost }}
    zkevm.l2-nats-seed-port: {{ .Values.rpc.chainConfig.natsSeedPort | int64 }}

    {{- if .Values.rpc.nats.enabled }}
    # Local NATS for downstream consumers
    zkevm.data-stream-nats-host: {{ .Values.rpc.chainConfig.dataStreamNatsHost }}
    zkevm.data-stream-nats-port: {{ .Values.rpc.chainConfig.dataStreamNatsPort | int64 }}
    {{- end }}
    
    # zkEVM L1 configuration
    zkevm.l1-chain-id: {{ .Values.rpc.chainConfig.l1ChainId | int64 }}
    zkevm.l1-rpc-url: {{ .Values.rpc.chainConfig.l1RpcUrl }}
    
    # Contract addresses
    zkevm.address-sequencer: "{{ .Values.rpc.chainConfig.addressSequencer }}"
    zkevm.address-zkevm: "{{ .Values.rpc.chainConfig.addressZkevm }}"
    zkevm.address-rollup: "{{ .Values.rpc.chainConfig.addressRollup }}"
    zkevm.address-ger-manager: "{{ .Values.rpc.chainConfig.addressGerManager }}"
    
    # Gas configuration
    zkevm.default-gas-price: {{ .Values.rpc.chainConfig.defaultGasPrice | int64 }}
    zkevm.max-gas-price: {{ .Values.rpc.chainConfig.maxGasPrice | int64 }}
    zkevm.gas-price-factor: {{ .Values.rpc.chainConfig.gasPriceFactor }}
    
    # L1 rollup configuration
    zkevm.l1-rollup-id: {{ .Values.rpc.chainConfig.l1RollupId | int64 }}
    zkevm.l1-first-block: {{ .Values.rpc.chainConfig.l1FirstBlock | int64 }}
    
    # Network configuration
    torrent.port: {{ .Values.rpc.chainConfig.torrentPort | int64 }}
{{- end }}
