{{- if .Values.rpc.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "cdk-erigon.fullname" . }}-rpc
  labels:
    {{- include "cdk-erigon.labels" . | nindent 4 }}
    component: rpc
spec:
  replicas: {{ .Values.rpc.replicas }}
  serviceName: {{ include "cdk-erigon.fullname" . }}-rpc
  selector:
    matchLabels:
      {{- include "cdk-erigon.selectorLabels" . | nindent 6 }}
      component: rpc
  template:
    metadata:
      labels:
        {{- include "cdk-erigon.selectorLabels" . | nindent 8 }}
        component: rpc
    spec:
      securityContext:
        runAsNonRoot: {{ .Values.rpc.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.rpc.securityContext.runAsUser }}
        runAsGroup: {{ .Values.rpc.securityContext.runAsGroup }}
        fsGroup: {{ .Values.rpc.securityContext.fsGroup }}
        seccompProfile:
          type: {{ .Values.rpc.securityContext.seccompProfile.type }}
      volumes:
      - name: chain-config
        configMap:
          name: {{ include "cdk-erigon.fullname" . }}-rpc-chain
      containers:
      - name: erigon
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        args:
        - "--config=/config/erigon.yaml"
        ports:
        - name: http
          containerPort: 8545
          protocol: TCP
        - name: ws
          containerPort: 8546
          protocol: TCP
        - name: private-api
          containerPort: 9093
          protocol: TCP
        {{- if .Values.rpc.nats.enabled }}
        - name: nats
          containerPort: {{ .Values.rpc.chainConfig.dataStreamNatsPort }}
          protocol: TCP
        {{- end }}
        {{- if .Values.monitoring.enabled }}
        - name: metrics
          containerPort: 6060
          protocol: TCP
        {{- end }}
        volumeMounts:
        - name: data
          mountPath: /data
        - name: chain-config
          mountPath: /config
          readOnly: true
        resources:
          {{- toYaml .Values.rpc.resources | nindent 10 }}
        securityContext:
          {{- toYaml .Values.rpc.containerSecurityContext | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
        - ReadWriteOnce
      {{- if .Values.rpc.persistence.storageClass }}
      storageClassName: {{ .Values.rpc.persistence.storageClass }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.rpc.persistence.size }}
{{- end }}
