{{- if and .Values.sequencer.enabled .Values.sequencer.nats.embedded .Values.sequencer.nats.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "cdk-erigon.fullname" . }}-nats
  labels:
    {{- include "cdk-erigon.labels" . | nindent 4 }}
    component: nats-monitoring
spec:
  selector:
    matchLabels:
      {{- include "cdk-erigon.selectorLabels" . | nindent 6 }}
      component: sequencer
  endpoints:
  - port: nats-mon
    interval: 30s
    path: /metrics
    scheme: http
{{- end }}
