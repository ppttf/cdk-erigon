{{- if and .Values.sequencer.enabled .Values.monitoring.enabled .Values.monitoring.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "cdk-erigon.fullname" . }}-sequencer
  labels:
    {{- include "cdk-erigon.labels" . | nindent 4 }}
    component: sequencer-monitoring
spec:
  selector:
    matchLabels:
      {{- include "cdk-erigon.selectorLabels" . | nindent 6 }}
      component: sequencer
  endpoints:
  - port: metrics
    interval: {{ .Values.monitoring.serviceMonitor.interval }}
    scrapeTimeout: {{ .Values.monitoring.serviceMonitor.scrapeTimeout }}
    path: /debug/metrics/prometheus
    scheme: http
{{- end }}
