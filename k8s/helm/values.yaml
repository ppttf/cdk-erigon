# Default values for cdk-erigon
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- Global image configuration
image:
  # -- Image repository
  repository: cdk-erigon
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Image tag (defaults to chart appVersion if not set)
  tag: ""

# -- Image pull secrets
imagePullSecrets: []

# -- Override chart name
nameOverride: ""
# -- Override full name
fullnameOverride: ""

# -- L1 RPC cache proxy (shared deployment)
l1Proxy:
  # -- Enable shared L1 RPC cache proxy
  enabled: false
  # -- L1 proxy image configuration
  image:
    repository: cdk-erigon-l1-proxy
    tag: latest
    pullPolicy: IfNotPresent
  # -- Resource requests and limits
  resources:
    requests:
      memory: 512Mi
      cpu: 100m
    limits:
      memory: 1Gi
      cpu: 500m
  # -- Persistence configuration for cache
  persistence:
    # -- Enable persistence for L1 cache
    enabled: true
    # -- Storage class for cache PVC
    storageClass: ""
    # -- Size of cache storage
    size: 5Gi
  # -- Cache size limit (when persistence is disabled)
  cacheSize: 1Gi

# -- Sequencer configuration
sequencer:
  # -- Enable sequencer component
  enabled: true

  # -- Number of sequencer replicas (must be 1 for embedded NATS)
  replicas: 1

  # -- NATS configuration
  nats:
    # -- Enable embedded NATS server
    embedded: true

    # NATS JetStream configuration
    # -- Maximum memory for JetStream (bytes, default 1GB)
    maxMemoryStore: 1073741824
    # -- Maximum file storage for JetStream (bytes, default 10GB)
    maxFileStore: 10737418240
    # -- Maximum payload size (bytes, default 8MB)
    maxPayload: 8388608
    # -- Maximum pending bytes (bytes, default 64MB)
    maxPending: 67108864

    # -- NATS persistence configuration
    persistence:
      # -- Enable persistence for NATS data
      enabled: true
      # -- Storage class for NATS PVC
      storageClass: ""
      # -- Size of NATS storage
      size: 10Gi

    # -- NATS monitoring configuration
    monitoring:
      # -- Enable NATS Prometheus metrics endpoint
      enabled: false
      # -- Monitoring HTTP port
      port: 8222

  # -- Blockchain data persistence
  persistence:
    # -- Enable persistence for blockchain data
    enabled: true
    # -- Storage class for data PVC
    storageClass: ""
    # -- Size of data storage
    size: 100Gi

  # -- Resource requests and limits
  resources:
    requests:
      memory: 8Gi
      cpu: 1000m
    limits:
      memory: 16Gi
      cpu: 2000m

  # -- Security context for sequencer pod
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  # -- Container security context
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL

  # Chain configuration for Erigon
  chainConfig:
    # -- Enable chain config ConfigMap
    enabled: false
    # -- Data directory path
    datadir: /data
    # -- Chain name (e.g., hermez-bali, hermez-dev, hermez-mainnet)
    chain: ""
    # -- L2 chain ID (required)
    chainId: 0
    # -- L1 chain ID
    l1ChainId: 0
    # -- L1 RPC URL
    l1RpcUrl: ""
    # -- L2 sequencer RPC URL
    l2SequencerRpcUrl: ""
    # -- L2 datastreamer URL
    l2DatastreamerUrl: ""
    # -- Sequencer contract address
    addressSequencer: ""
    # -- ZkEVM contract address
    addressZkevm: ""
    # -- Rollup contract address
    addressRollup: ""
    # -- GER Manager contract address
    addressGerManager: ""
    # -- L1 first block number
    l1FirstBlock: 0
    # -- L1 rollup ID
    l1RollupId: 1
    # -- Default gas price (wei)
    defaultGasPrice: 1000000000
    # -- Maximum gas price (0 = no limit)
    maxGasPrice: 0
    # -- Gas price factor
    gasPriceFactor: 0.12
    # -- Enable shadow sequencer mode
    shadowSequencer: false
    # -- Torrent port
    torrentPort: 42070
    # -- Executor strict mode
    executorStrict: false
    # -- Data stream port
    dataStreamPort: 6900
    # -- Data stream NATS host
    dataStreamNatsHost: "0.0.0.0"
    # -- Data stream NATS port
    dataStreamNatsPort: 4222

# -- RPC node configuration
rpc:
  # -- Enable RPC nodes
  enabled: false

  # -- Number of RPC replicas
  replicas: 1

  # -- Service configuration
  service:
    # -- Service type (ClusterIP, LoadBalancer, NodePort)
    type: ClusterIP

  # -- NATS configuration for RPC nodes
  nats:
    # -- Enable local NATS server (for downstream consumers)
    enabled: false

  # -- Blockchain data persistence
  persistence:
    # -- Enable persistence for blockchain data
    enabled: true
    # -- Storage class for data PVC
    storageClass: ""
    # -- Size of data storage
    size: 100Gi

  # -- Resource requests and limits
  resources:
    requests:
      memory: 2Gi
      cpu: 1000m
    limits:
      memory: 4Gi
      cpu: 2000m

  # -- Security context for RPC pod
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  # -- Container security context
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL

  # Chain configuration for RPC node
  chainConfig:
    # -- Data directory path
    datadir: /data
    # -- Chain name (e.g., hermez-bali, hermez-dev, hermez-mainnet)
    chain: ""
    # -- L2 chain ID (required)
    chainId: 0
    # -- L1 chain ID
    l1ChainId: 0
    # -- L1 RPC URL
    l1RpcUrl: ""
    # -- L2 sequencer RPC URL
    l2SequencerRpcUrl: ""
    # -- L2 datastreamer URL
    l2DatastreamerUrl: ""
    # -- NATS seed host (sequencer NATS address)
    natsSeedHost: ""
    # -- NATS seed port (sequencer NATS port, typically 4222)
    natsSeedPort: 4222
    # -- Data stream NATS host (local)
    dataStreamNatsHost: "0.0.0.0"
    # -- Data stream NATS port (local, different from sequencer)
    dataStreamNatsPort: 4223
    # -- Sequencer contract address
    addressSequencer: ""
    # -- ZkEVM contract address
    addressZkevm: ""
    # -- Rollup contract address
    addressRollup: ""
    # -- GER Manager contract address
    addressGerManager: ""
    # -- L1 first block number
    l1FirstBlock: 0
    # -- L1 rollup ID
    l1RollupId: 1
    # -- Default gas price (wei)
    defaultGasPrice: 1000000000
    # -- Maximum gas price (0 = no limit)
    maxGasPrice: 0
    # -- Gas price factor
    gasPriceFactor: 0.12
    # -- Torrent port (different from sequencer)
    torrentPort: 42071
